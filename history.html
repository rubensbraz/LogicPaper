<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <title>
            LogicPaper | Execution History
        </title>
        
        <meta name="description"
              content="
    View your LogicPaper job execution history, check status, and re-download completed files.
"
              data-i18n-attr="content:meta.description_history">
        <meta name="keywords"
              content="batch processing, document generation, job history, logicpaper"
              data-i18n-attr="content:meta.keywords">
        <meta name="author" content="Rubens Braz">
        
        <link rel="icon"
              href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📘</text></svg>">
            
            <script src="https://cdn.tailwindcss.com"></script>
            <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;600;800&display=swap"
                  rel="stylesheet">
            <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
            
            <link rel="stylesheet" href="css/style.css">
            
            
            <script>
            // Injected by build_static.py or defaults to false
            window.IS_STATIC = true;
            </script>
            <script src="js/config.js"></script>
            <script src="js/locales.js"></script>
            <script src="js/i18n.js"></script>
            <script src="js/utils.js"></script>
            
        </head>
        <body class="min-h-screen p-4 md:p-8 flex flex-col items-center">
            
            <div id="navbar-mount" class="w-full flex justify-center"></div>
<script src="js/navbar.js"></script>
            
            
    <main class="w-full max-w-7xl mt-4 animate-in fade-in zoom-in duration-300">
        <div class="glass-panel p-6 rounded-2xl shadow-2xl">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-bold text-gray-100 flex items-center gap-3">
                    <span class="text-2xl">📜</span>
                    <span data-i18n="history.title">Execution History</span>
                </h2>
                <button onclick="loadHistory()"
                        class="group flex items-center gap-2 px-4 py-2 bg-white/5 hover:bg-white/10 border border-white/5 rounded-xl transition text-sm text-gray-400 hover:text-white">
                    <svg class="w-4 h-4 group-hover:rotate-180 transition-transform duration-500"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    <span data-i18n="history.btn_refresh">Refresh</span>
                </button>
            </div>
            <div class="overflow-x-auto rounded-xl border border-white/10">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="text-xs font-mono uppercase tracking-wider text-gray-500 bg-black/40 border-b border-white/10">
                            <th class="p-4" data-i18n="history.col_date">Date</th>
                            <th class="p-4" data-i18n="history.col_input">Input File</th>
                            <th class="p-4" data-i18n="history.col_status">Status</th>
                            <th class="p-4 text-center" data-i18n="history.col_stats">Files</th>
                            <th class="p-4 text-right" data-i18n="history.col_action">Action</th>
                        </tr>
                    </thead>
                    <tbody id="history-table-body"
                           class="text-sm text-gray-300 divide-y divide-white/5 bg-black/20">
                        <tr>
                            <td colspan="5"
                                class="p-8 text-center text-gray-500 animate-pulse"
                                data-i18n="history.loading">Loading history...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

            
            <footer class="w-full max-w-7xl mt-auto pt-12 pb-8 px-4 md:px-0">
    <div class="glass-panel rounded-2xl p-6 flex flex-col md:flex-row items-center justify-between gap-4 border-t border-white/5">
        <div class="flex flex-col items-center md:items-start gap-1">
            <p class="text-sm text-gray-500 font-mono" data-i18n="footer.copy">LogicPaper © 2025. All rights reserved.</p>
            <a href="https://github.com/rubensbraz/LogicPaper"
               target="_blank"
               class="text-[12px] text-blue-400 hover:text-blue-300 transition flex items-center gap-1 uppercase tracking-widest font-bold">
                <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z" />
                </svg>
                <span data-i18n="footer.repo">Source Code</span>
            </a>
        </div>
        <div class="text-sm text-gray-400 flex items-center gap-1.5 bg-white/5 px-4 py-2 rounded-full border border-white/5">
            <span data-i18n="footer.made_by">Built by</span>
            <a href="https://rubensbraz.com"
               target="_blank"
               class="font-bold text-white hover:text-blue-400 transition underline decoration-blue-500/30 underline-offset-4"
               data-i18n="footer.author">Rubens Braz</a>
        </div>
    </div>
</footer>
            
            <script src="js/history.js"></script>
        </body>
    </html>
